name: Build and publish Docker images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase owner name
        id: vars
        run: echo "image_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push sensors image
        uses: docker/build-push-action@v6
        with:
          context: ./sensors
          file: ./sensors/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.image_owner }}/opdracht-switching-routing-sensors:latest
            ghcr.io/${{ steps.vars.outputs.image_owner }}/opdracht-switching-routing-sensors:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Update repository on VM
        run: |
          cd /opt/opdracht-switching-routing
          git pull --ff-only origin main

      - name: Deploy containers
        run: |
          cd /opt/opdracht-switching-routing
          chmod +x deploy.sh
          ./deploy.sh